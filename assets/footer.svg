<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 190" width="1280" height="190" role="img" aria-labelledby="t">
<title id="t">Build. Break. Understand. Rebuild.</title>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0D1117"/><stop offset="1" stop-color="#161B22"/></linearGradient>
  <radialGradient id="glow" cx="0.5" cy="0" r="0.7"><stop offset="0" stop-color="#8B72D9" stop-opacity="0.30"/><stop offset="1" stop-color="#8B72D9" stop-opacity="0"/></radialGradient>
  <linearGradient id="accent" x1="0" x2="1"><stop offset="0" stop-color="#8B72D9" stop-opacity="0"/><stop offset="0.5" stop-color="#B7A5F0"/><stop offset="1" stop-color="#8B72D9" stop-opacity="0"/></linearGradient>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#8B72D9" stroke-opacity="0.07"/></pattern>
</defs>
<rect width="1280" height="190" rx="16" fill="url(#bg)"/>
<rect width="1280" height="190" rx="16" fill="url(#grid)"/>
<rect width="1280" height="190" rx="16" fill="url(#glow)"/>
<rect x="440" y="38" width="400" height="2" fill="url(#accent)"/>
<text x="640" y="88" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="30" font-weight="700" letter-spacing="7" fill="#FFFFFF">BUILD.  BREAK.  UNDERSTAND.  REBUILD.</text>
<text x="640" y="122" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="16" fill="#C9D1D9">Turning curiosity into code. Ideas into innovation. Challenges into solutions.</text>
<text x="640" y="156" text-anchor="middle" font-family="'JetBrains Mono','SFMono-Regular',Consolas,monospace" font-size="12" letter-spacing="3" fill="#8B72D9">STILL BUILDING  ·  STILL EXPLORING  ·  NEVER SETTLING</text>
<rect x="0.5" y="0.5" width="1279" height="189" rx="16" fill="none" stroke="#30363D"/>
</svg>